baseURL = "https://wardepartmentpapers.org/"
locale = "en-US"
title = "Papers of the War Department"
staticDir = ["static"]

[params]
  # Empty: images load from same-origin /files/*, which the site's Caddy
  # proxies to the wardepartmentpapers.org Garage bucket.
  mediaBaseURL = ""

[taxonomies]
  author = "authors"
  recipient = "recipients"
  collection = "collections"
  repository = "repositories"
  doc_type = "doc_types"
  category = "categories"

[pagination]
  pagerSize = 25

[markup.goldmark.renderer]
  unsafe = true
