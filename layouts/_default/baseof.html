<!DOCTYPE html>
<html lang="en-US">
<head>
    {{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}{{ end }}">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="notice" style="font-family: -apple-system, BlinkMacSystemFont, avenir next, avenir, segoe ui, helvetica neue, Adwaita Sans, Cantarell, Ubuntu, roboto, noto, helvetica, arial, sans-serif;; font-size: 14px; display: flex; align-items: center; background-color: #f8f8f8; padding: 10px; border: 1px solid #ddd; margin-bottom: 0;">
        <a href="https://rrchnm.org" target="_blank"><img src="/img/rrchnm.png" alt="RRCHNM Logo" style="height: 30px; margin-right: 15px;"/></a>
        <div>
        This is a static copy of the final website maintained by the <a href="https://rrchnm.org" target="_blank">Roy Rosenzweig Center for History and New Media</a>.
        </div>
    </div>
    <header class="site-header">
        <div class="wrapper">
            <a href="/" class="site-title logo"><img src="/img/pwd-logo.png" alt="Papers of the War Department, 1784-1800 — Home"></a>
            <nav class="site-nav" aria-label="Site navigation">
                <button class="nav-toggle" aria-expanded="false" aria-label="Menu">
                    <span class="menu-icon"></span>
                </button>
                <div class="trigger" id="site-nav-menu">
                    {{ partial "nav.html" . }}
                </div>
            </nav>
        </div>
    </header>
    <main id="main-content" class="page-content">
        <div class="wrapper">
            {{ block "main" . }}{{ end }}
        </div>
    </main>
    <footer class="site-footer h-card">
        {{ partial "footer.html" . }}
    </footer>
</body>
</html>
